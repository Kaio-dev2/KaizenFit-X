name: CD — Release Automático

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🏷️ Criar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "🏋️ KaizenFit v1.0.${{ github.run_number }}"
          generate_release_notes: true
          body: |
            ## 🚀 Deploy Automático

            **URL de Produção:** https://kaizen-fit-x.vercel.app
            **Admin:** https://kaizen-fit-x.vercel.app/admin

            ---
            ### 📝 O que mudou nessa versão: